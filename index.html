<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home Pulse Health V2｜交互原型</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
  <style>
    :root {

    *{box-sizing:border-box}
    html{color-scheme:light}
    body{margin:0;min-width:320px;min-height:100dvh;background:var(--canvas);color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}

    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(121,191,232,.35);outline-offset:2px}
    h1,h2,h3,p{margin-top:0} h1{font-size:30px;line-height:1.08;letter-spacing:-.045em;margin-bottom:8px} h2{font-size:19px;letter-spacing:-.025em;margin-bottom:9px} h3{font-size:15px;margin-bottom:5px}
    .muted{color:var(--muted)} .small{font-size:12px}.eyebrow{margin:0 0 7px;color:var(--muted);font-weight:750;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .shell{display:grid;grid-template-columns:296px minmax(460px,1fr) 286px;min-height:100dvh}

    .rail.right{border-right:0;border-left:1px solid #d4dae6;background:rgba(244,247,252,.92)}

    .brand-orb{width:34px;height:34px;border-radius:13px;background:linear-gradient(145deg,var(--mint),var(--sky));position:relative;box-shadow:inset 0 1px rgba(255,255,255,.7)}
    .brand-orb:before,.brand-orb:after{content:"";position:absolute;top:13px;width:4px;height:5px;border-radius:50%;background:var(--navy)}.brand-orb:before{left:10px}.brand-orb:after{right:10px}
    .rail-title{margin:22px 0 8px;color:#8790a5;font-size:11px;font-weight:780;letter-spacing:.08em;text-transform:uppercase}

    .page-link,.state-link{width:100%;border:1px solid transparent;border-radius:12px;background:transparent;padding:9px 10px;text-align:left;display:flex;gap:10px;align-items:center}
    .page-link:hover,.state-link:hover{background:#f1f4f9}.page-link.active{background:#e6f2f8;border-color:#c2ddec;color:#214b68}
    .index{width:23px;height:23px;display:grid;place-items:center;border-radius:8px;background:#edf0f5;color:#768096;font-size:10px;font-weight:750;flex:0 0 auto}.page-link.active .index{background:var(--sky);color:#fff}
    .state-link{display:block;border-color:var(--line);background:#fff;margin-bottom:7px;padding:11px 12px}.state-link strong{display:block}.state-link span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
    .stage{min-width:0;padding:26px;display:grid;place-items:start center;overflow:auto}
    .phone{width:min(440px,100%);min-height:860px;border:1px solid #c6cfdd;border-radius:38px;overflow:hidden;background:var(--phone);box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column}
    .statusbar{height:33px;padding:9px 20px 0;display:flex;justify-content:space-between;color:#576078;font-size:11px;font-weight:700}
    #app{flex:1;min-height:780px;padding-bottom:82px;position:relative}
    .header{height:56px;padding:6px 19px 11px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .header-title{font-weight:820;font-size:21px;letter-spacing:-.03em}.header-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{width:38px;height:38px;border:1px solid #d8deea;background:rgba(255,255,255,.82);border-radius:13px;display:grid;place-items:center;font-size:17px;font-weight:650}.back-btn{border:0;background:transparent;padding:8px 2px;font-weight:720}
    .page{padding:12px 18px 34px}.section{margin:25px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.section-head h2{margin:0}
    .text-btn{border:0;background:transparent;color:#39759a;padding:3px;font-weight:720}.primary,.secondary,.soft-btn{min-height:45px;border-radius:14px;padding:11px 16px;font-weight:780;white-space:nowrap}.primary{background:var(--navy);border:1px solid var(--navy);color:#fff}.secondary{background:#fff;border:1px solid #cbd3e0}.soft-btn{background:var(--sky-soft);border:1px solid #c5dfef;color:#295c7e}.button-row{display:flex;gap:9px;flex-wrap:wrap}.button-row>button{flex:1}

    .spirit.warn{background:linear-gradient(145deg,#f2c36d,#eaa15d)}.spirit.warn .mouth{width:22px;height:9px;border-bottom:0;border-top:4px solid var(--navy);border-radius:18px 18px 0 0;top:80px}.spirit.alert{background:linear-gradient(145deg,#ea9188,#d86f79)}.spirit.small{width:76px;height:70px;border-radius:31px}.spirit.small:before{top:-17px;left:13px;right:13px;height:38px}.spirit.small .eye{top:29px;width:6px;height:7px}.spirit.small .eye.left{left:23px}.spirit.small .eye.right{right:23px}.spirit.small .mouth{top:45px;width:20px;height:9px;border-bottom-width:3px}
    .score{font-size:48px;font-weight:860;line-height:1;letter-spacing:-.06em}.score-label{font-size:13px;color:var(--muted);font-weight:700;margin:5px 0}.hero-status{font-size:18px;font-weight:820;margin:8px 0 4px}.hero-copy{color:var(--muted);font-size:12px;margin:0}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.metric-card{min-height:142px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}.metric-card.attention{background:var(--orange-soft);border-color:#f0cf9f}.metric-icon{width:42px;height:42px;border-radius:14px;background:var(--sky-soft);display:grid;place-items:center;color:#315f7c}.metric-icon .ph{font-size:24px}.metric-card.attention .metric-icon{background:#ffe2b9;color:#9b641f}.metric-card strong{display:block;font-size:19px;letter-spacing:-.03em}.metric-card .label{font-size:12px;color:var(--muted);font-weight:680}.metric-card .meta{font-size:11px;color:var(--muted)}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:4px}.progress{height:5px;border-radius:10px;background:#edf0f5;margin-top:8px;overflow:hidden}.progress span{display:block;height:100%;width:55%;background:var(--violet);border-radius:inherit}

    .list-card{display:grid;grid-template-columns:47px 1fr auto;gap:12px;align-items:center}.list-card+.list-card{margin-top:11px}.list-icon{width:47px;height:47px;border-radius:16px;background:var(--mint-soft);display:grid;place-items:center;color:#2f7e6b}.list-icon .ph{font-size:25px}.spark{width:72px;height:28px;display:flex;align-items:end;gap:3px}.spark i{display:block;width:7px;background:#9ccfc3;border-radius:5px}.chev{color:#a0a7b6;font-size:18px}

    .data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.data-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.data-box strong{font-size:21px;display:block}.data-box span{font-size:11px;color:var(--muted)}
    .camera{height:165px;border-radius:17px;background:linear-gradient(135deg,#dfe4eb 0 49%,#cfd6e0 49% 51%,#e8ecf1 51%);display:grid;place-items:center;color:#5f6a7c;font-weight:750}.explanation{padding:13px 2px 0;color:var(--muted);font-size:12px}.timeline{padding-left:24px;position:relative}.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#d9dfeb}.timeline-item{position:relative;padding:0 0 20px}.timeline-item:before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--sky);border:3px solid var(--phone)}.timeline-item.muted-node:before{background:#c4cad5}.timeline-item.warn-node:before{background:var(--orange)}.timeline-item p{margin:3px 0 0;color:var(--muted);font-size:12px}.timeline-item time{display:block;color:#8a92a3;font-size:11px;margin-bottom:3px}

    .week-bars{height:165px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:9px;padding:13px 2px 25px}.week-bar{height:var(--h);background:linear-gradient(var(--sky),var(--mint));border-radius:10px 10px 4px 4px;position:relative}.week-bar.warn{background:linear-gradient(#f0bf77,var(--orange))}.week-bar:after{content:attr(data-d);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);color:var(--muted);font-size:10px}

    .memory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.memory-card{min-height:156px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left}.memory-card strong{display:block;margin:9px 0 5px}.memory-card p{font-size:11px;color:var(--muted);margin:0}.memory-card .tag{margin-top:11px}
    textarea,input[type=text],select{width:100%;border:1px solid #cbd3e0;border-radius:14px;background:#fff;padding:12px}textarea{min-height:94px;resize:vertical}.entity-row{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.entity-btn{min-width:72px;border:1px solid var(--line);background:#fff;border-radius:17px;padding:10px 7px;text-align:center}.entity-btn.selected{background:var(--sky-soft);border-color:#9fcce5}.entity-btn .list-icon{width:38px;height:38px;margin:auto;border-radius:13px}.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.video{border:2px solid transparent;background:#fff;border-radius:17px;padding:7px;text-align:left}.video.selected{border-color:var(--sky)}.video-thumb{height:69px;border-radius:12px;background:#e1e6ed;display:grid;place-items:center;color:#687285;font-size:11px}.video strong{display:block;font-size:11px;margin-top:7px}.video span{font-size:10px;color:var(--muted)}
    .state-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.state-card{min-height:124px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:13px}.state-card.wide{grid-column:1/-1;min-height:auto}.state-card p{font-size:11px;color:var(--muted);margin:5px 0 10px}

    .device{border-radius:30px;padding:12px;background:#ccd2dc;box-shadow:0 20px 38px rgba(39,51,75,.18);margin:22px auto;width:92%;max-width:330px}.device-screen{aspect-ratio:1.38;border:2px solid #555e6d;border-radius:20px;background:#f1f1eb;display:grid;place-items:center;text-align:center}.device-screen .spirit.small{margin:0 auto 12px}.device-screen strong{display:block;font-size:18px}.device-states{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.device-state{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px;text-align:left}.device-state strong{display:block}.device-state span{font-size:10px;color:var(--muted)}

</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="V2 页面导航">
      <div class="brand"><span class="brand-orb"></span><span>Home Pulse V2</span></div>
      <div class="rail-title">全部页面</div>
      <div class="page-links" id="page-links"></div>
      <div class="rail-title">关键状态 · 独立流程</div>
      <button class="state-link" onclick="setHomeMood('calm')"><strong>92% · 今日平稳</strong><span>薄荷绿家庭精灵，5 项确认</span></button>
      <button class="state-link" onclick="setHomeMood('attention')"><strong>68% · 需要关注</strong><span>后院门持续开启 18 分钟</span></button>
      <button class="state-link" onclick="showAttentionPreview()"><strong>跨载体注意力路由</strong><span>手机 / Widget / Home Display</span></button>
    </aside>

    <main class="stage">
      <section class="phone" aria-label="Home Pulse V2 手机界面">
        <div class="statusbar"><span id="clock">9:41</span><span>●●●  Wi-Fi  86%</span></div>
        <div id="app"></div>
      </section>
    </main>

    <aside class="rail right" aria-label="设计说明">
      <div class="rail-title">产品隐喻</div>
      <div class="route-card"><strong>家是一种状态</strong><p>像查看身体健康一样查看家的当前状态。</p></div><div class="route-arrow">↓</div>
      <div class="route-card"><strong>关注事项是指标</strong><p>每件关心的事都拥有持续状态与趋势。</p></div><div class="route-arrow">↓</div>

  <script>
    const state={route:'today',mood:'calm',date:27,trendRange:'周',selectedEntity:'Buddy',selectedVideos:new Set(['v1','v2','v3']),memoryAdded:false,attentionLevel:2,displayMode:'calm'};
    const pages=[
      ['today','今天的家','查看家的综合状态与今日指标。'],

      ['guard','守护','像健康指标一样查看所有关注事项。'],
      ['buddy','Buddy 进食详情','查看持续趋势、数据和视频证据。'],

      ['activity','今日动态','查看有意义的家庭状态变化。'],
      ['insights','洞察','查看本周家庭状态与打扰压缩。'],
      ['trends','趋势详情','按周、月、年查看家庭状态。'],
      ['calendar','家庭日历','用家庭角色回顾每一天。'],
      ['weekly','家庭周报','查看平均安心度和校准建议。'],
      ['memory','记忆大脑','清楚查看 Home Pulse 理解了什么。'],
      ['add','新增关注事项','通过对象、描述和录像建立指标。'],

      ['attention','注意力路由','查看四个等级如何触达用户。'],

    function spirit(cls=''){return `<div class="spirit ${cls}"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div>`}
    function objectIcon(name,label=''){return `<i class="ph ph-${name}" aria-hidden="true"></i>${label?`<span class="sr-only">${label}</span>`:''}`}
    function header(title,back='',action=''){return `<header class="header"><div>${back?`<button class="back-btn" onclick="go('${back}')">← 返回</button>`:`<div class="header-title">${title}</div>`}</div><div class="header-actions">${action}</div></header>`}
    function nav(active){return `<nav class="floating-nav"><button class="nav-btn ${active==='today'?'active':''}" onclick="go('today')"><b>⌂</b><span>今天</span></button><button class="nav-btn ${active==='guard'?'active':''}" onclick="go('guard')"><b>◇</b><span>守护</span></button><button class="nav-btn ${active==='insights'?'active':''}" onclick="go('insights')"><b>⌁</b><span>洞察</span></button><button class="nav-btn ${active==='memory'?'active':''}" onclick="go('memory')"><b>◎</b><span>记忆</span></button><button class="nav-btn ${active==='profile'?'active':''}" onclick="go('display')"><b>☰</b><span>我的</span></button></nav>`}
    function metric(icon,label,value,meta,onclick,extra=''){return `<button class="metric-card ${extra}" onclick="${onclick}"><span class="metric-icon">${objectIcon(icon,label)}</span><span><span class="label">${label}</span><strong>${value}</strong><span class="meta">${meta}</span></span></button>`}
    function homePage(alert=false){
      const mood=alert?'attention':state.mood,needs=mood==='attention';
      const dates=[21,22,23,24,25,26,27];
      return `${header('今天','',`<button class="soft-btn" onclick="showFamily()">Lake House⌄</button><button class="icon-btn" onclick="showSettings()">⚙</button>`)}<div class="page">
        <div class="date-strip">${dates.map(d=>`<button class="date-btn ${state.date===d?'active':''}" onclick="selectDate(${d})"><strong>${d}</strong><i class="mini-face ${d===25?'warn':d===24?'wait':''}"></i></button>`).join('')}</div>
        <section class="hero"><div class="spirit-wrap"><i class="glow"></i>${spirit(needs?'warn':'')}</div><div class="score">${needs?'68':'92'}%</div><div class="score-label">今日安心度 <button class="text-btn" onclick="showScoreInfo()">ⓘ</button></div><div class="hero-status">${needs?'有 1 项需要你关注':'目前一切平稳'}</div><p class="hero-copy">${needs?'5 项稳定 · 1 项需要查看':'6 项正在守护 · 5 项已确认 · 1 项等待中'}</p></section>
        <div class="section-head"><h2>今天的家</h2><button class="text-btn" onclick="go('activity')">今天的变化</button></div>
        <div class="metrics">
          ${needs?metric('door-open','后院门','仍开启','已持续 18 分钟',"go('package')",'attention'):metric('package','门口包裹','仍在','10:24 更新',"go('package')")}
          ${metric('user-circle','Emma 到家','已到家','16:52',"showQuick('Emma 到家','已确认正常到家')")}
          ${metric('bowl-food','下午进食',needs?'已进食':'等待中',needs?'15:36 已确认':'通常 15:20–15:50',"go('buddy')")}
          ${metric('dog','Buddy 是否离院','仍在院内','状态稳定',"showQuick('Buddy 是否离院','仍在院内')")}
          ${metric('door-open','后院门',needs?'需关注':'已关闭',needs?'离家后仍开启':'17:02 更新',needs?"go('package')":"showQuick('后院门','已关闭')",needs?'attention':'')}
          ${metric('plus','添加关注事项','建立新指标','对象 + 需求 + 录像',"go('add')")}
        </div>
      </div>${nav('today')}`
    }
    function guardPage(){const items=[['package','门口包裹','仍在门口','状态稳定','package'],['user-circle','Emma 是否到家','已到家 · 16:52','正常',''],['bowl-food','Buddy 下午进食','等待观察','通常 15:20–15:50','buddy'],['dog','Buddy 是否离开院子','仍在院内','稳定',''],['door-open','后院门','已关闭','17:02 更新',''],['tree','后院活动','平稳','无待处理状态','']];return `${header('守护','',`<button class="icon-btn" onclick="showFilter()">≡</button><button class="icon-btn" onclick="go('add')">＋</button>`)}<div class="page"><p class="muted">Home Pulse 正在持续关注这些事情</p><div class="section">${items.map((x,i)=>`<button class="card list-card" style="width:100%;text-align:left" onclick="${x[4]?`go('${x[4]}')`:`showQuick('${x[1]}','${x[2]}')`}"><span class="list-icon">${objectIcon(x[0],x[1])}</span><span><span class="card-title">${x[1]}</span><br><strong>${x[2]}</strong><br><span class="small ${i===2?'state-warn':'state-good'}">${x[3]}</span></span>${i<3?`<span class="spark">${[11,18,15,23,20,26,22].map(h=>`<i style="height:${h}px"></i>`).join('')}</span>`:'<span class="chev">›</span>'}</button>`).join('')}</div></div>${nav('guard')}`}
    function buddyPage(){return `${header('', 'guard')}<div class="page"><p class="eyebrow">9月20日 – 9月26日</p><h1>Buddy 下午进食</h1><div class="big-state">15:36</div><span class="tag">今天已观察到进食 · 正常</span><p class="muted" style="margin-top:10px">最近 Buddy 通常在 15:20–15:50 之间完成进食。</p><section class="card section"><h2>过去 7 天</h2><div class="chart"><i class="chart-band"></i><div class="line-chart">${[['五',72],['六',47],['日',76],['一',60],['二',66],['三',52],['今',63]].map(x=>`<div class="point-col" style="--h:${x[1]}px"><i class="line-point"></i><small>${x[0]}</small></div>`).join('')}</div></div></section><div class="data-grid"><div class="data-box"><strong>15:35</strong><span>本周平均</span></div><div class="data-box"><strong>晚 8 分钟</strong><span>相比上周</span></div><div class="data-box"><strong>15:18</strong><span>最早一天</span></div><div class="data-box"><strong>15:51</strong><span>最晚一天</span></div></div><section class="card section"><h2>今天的证据</h2><div class="camera">Buddy 在食盆旁进食</div><p class="explanation">15:36 观察到 Buddy 持续低头进食约 4 分钟，因此状态更新为“已观察到进食”。</p></section><div class="button-row"><button class="primary" onclick="showVideo()">查看录像</button><button class="secondary" onclick="go('attention')">调整关注方式</button></div></div>${nav('guard')}`}
    function packagePage(){return `${header('', 'guard')}<div class="page"><p class="eyebrow">关注事项</p><h1>门口包裹</h1><div class="big-state">仍在门口</div><span class="tag">状态稳定</span><p class="muted" style="margin-top:10px">10:24 送达 · 10:48 最近确认</p><section class="card section"><h2>今天的状态</h2><div class="timeline"><div class="timeline-item muted-node"><time>09:00</time><strong>未送达</strong></div><div class="timeline-item"><time>10:24</time><strong>已送达</strong></div><div class="timeline-item"><time>10:31–10:48</time><strong>仍在</strong><p>期间检测到 4 次人员经过，包裹状态未变化。</p></div></div></section><section class="card section"><h2>当前证据</h2><div class="camera">前门摄像头 · 纸箱仍在门口</div><p class="explanation">包裹位置与送达时基本一致。</p></section><section class="card section"><h2>状态规则</h2><div class="info-row"><span>已送达</span><span class="tag">普通告知</span></div><div class="info-row"><span>仍在</span><span class="tag grey">静默</span></div><div class="info-row"><span>位置变化</span><span class="tag warn">需要关注</span></div><div class="info-row"><span>无法确认</span><span class="tag violet">动态判断</span></div></section></div>${nav('guard')}`}
    function activityPage(){const ev=[['08:12','离家状态开始','门已关闭 · 后院门已关闭',''],['10:24','包裹已送达','前门门铃完成确认',''],['10:31–11:08','包裹仍在','期间 4 次人员经过，状态未变化','muted-node'],['15:36','已观察到 Buddy 进食','持续进食约 4 分钟',''],['16:52','Emma 已到家','身份与进入动作已确认',''],['18:21','后院多人活动','当前属于可解释活动，无需处理','muted-node']];return `${header('今天的变化','',`<button class="icon-btn" onclick="showActivityInfo()">i</button>`)}<div class="page"><div class="card summary-card"><span><strong>7 次</strong><br><span class="muted small">有意义的状态变化</span></span><span class="tag grey">126 次底层检测</span></div><p class="small muted" style="margin:10px 3px 24px">底层事件不会全部变成通知。</p><div class="timeline">${ev.map(x=>`<button class="timeline-item ${x[3]}" style="width:100%;border:0;background:transparent;text-align:left" onclick="showEvidence('${x[1]}','${x[2]}')"><time>${x[0]}</time><strong>${x[1]}</strong><p>${x[2]}</p></button>`).join('')}</div></div>${nav('today')}`}
    function insightsPage(){return `${header('洞察','',`<button class="icon-btn" onclick="go('calendar')">▦</button>`)}<div class="page"><section class="card"><div class="section-head"><h2>本周家庭状态趋势</h2><span class="tag">当前平稳</span></div><div class="week-bars">${[['一',91],['二',94],['三',88],['四',93],['五',72],['六',89],['日',92]].map(x=>`<i class="week-bar ${x[1]<80?'warn':''}" style="--h:${x[1]}%" data-d="${x[0]}"></i>`).join('')}</div><div class="summary-card"><span><strong>92%</strong><br><span class="small muted">当前安心度</span></span><button class="soft-btn" onclick="go('trends')">查看详情</button></div><p class="small muted" style="margin-top:14px">本周整体状态稳定。周五由于后院门离家后长时间未关闭，安心度短暂下降。</p></section><div class="counter-row section"><div class="counter"><strong>31</strong><span>本周有效状态变化</span></div><div class="counter"><strong>4</strong><span>真正打扰你的次数</span></div></div><div class="note"><strong>Camera 处理了 468 次底层视觉事件</strong><p class="small muted" style="margin:5px 0 0">Home Pulse 将它们压缩成真正有意义的状态。</p></div><div class="button-row section"><button class="primary" onclick="go('trends')">查看全部趋势</button><button class="secondary" onclick="go('weekly')">查看周报</button></div></div>${nav('insights')}`}
    function trendsPage(){let values=state.trendRange==='周'?[91,94,88,93,72,89,92]:state.trendRange==='月'?[88,92,86,94,89,91,90]:[84,87,90,89,92,91,93];return `${header('', 'insights',`<button class="icon-btn" onclick="toast('趋势摘要已准备')">↗</button>`)}<div class="page"><h1>趋势</h1><div class="segment section">${['周','月','年'].map(x=>`<button class="${state.trendRange===x?'active':''}" onclick="setTrend('${x}')">${x}</button>`).join('')}</div><p class="small muted">10/21 – 10/27</p><section class="card"><h2>每日家庭状态趋势</h2><div class="week-bars">${values.map((v,i)=>`<i class="week-bar ${v<80?'warn':''}" style="--h:${v}%" data-d="${i+1}"></i>`).join('')}</div><div class="data-grid"><div><strong>89%</strong><span class="small muted"> 平均安心度</span></div><div><strong>6 天</strong><span class="small muted"> 平稳日</span></div><div><strong>1 天</strong><span class="small muted"> 需要关注</span></div><div><strong>0 天</strong><span class="small muted"> 高优先异常</span></div></div></section><section class="card section"><h2>需要关注发生时间</h2><div class="dot-matrix">${Array.from({length:84},(_,i)=>`<i class="${[18,42,67].includes(i)?'hit':''}"></i>`).join('')}</div><div class="section-head" style="margin-top:14px"><span class="small muted">周一</span><span class="small muted">周日</span></div></section><div class="data-grid"><div class="data-box"><strong>72%</strong><span>最低 · 10/25 18:43</span></div><div class="data-box"><strong>96%</strong><span>最高 · 10/23</span></div></div><button class="secondary" style="width:100%;margin-top:15px" onclick="go('calendar')">数据详情 · 家庭日历</button></div>${nav('insights')}`}
    function calendarPage(){const blanks=2,days=Array.from({length:30},(_,i)=>i+1);return `${header('', 'insights')}<div class="page"><p class="eyebrow">九月</p><h1>家庭日历</h1><section class="card section"><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:blanks},()=>'<span class="day empty"></span>').join('')}${days.map(d=>`<button class="day ${d===27?'current':''}" onclick="showDay(${d})"><b>${d}</b><i class="mini-face ${[24,25,26].includes(d)?'warn':d===12?'danger':d===18?'wait':''}"></i></button>`).join('')}</div></section><section class="card"><h2>本月统计</h2><div class="info-row"><span>平稳天数</span><strong>26 天</strong></div><div class="info-row"><span>普通状态变化</span><strong>18 次</strong></div><div class="info-row"><span>需要关注</span><strong class="state-warn">4 次</strong></div><div class="info-row"><span>紧急</span><strong>1 次</strong></div></section><section class="card section"><h2>最常出现的关注事项</h2><p>Buddy 下午进食 · 门口包裹 · Emma 到家</p></section></div>${nav('insights')}`}
    function weeklyPage(){return `${header('', 'insights')}<div class="page"><p class="eyebrow">9月21日 – 9月27日</p><section class="hero" style="padding-top:0"><div class="spirit-wrap" style="height:120px">${spirit('small')}</div><h1>这一周，家整体很平稳</h1><div class="score">91%</div><div class="score-label">平均安心度</div></section><section class="card"><div class="funnel"><div class="funnel-row" style="--w:100%"><strong>468</strong><span>底层视觉事件</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:83%"><strong>31</strong><span>有效状态变化</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:67%"><strong>7</strong><span>值得知道</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:51%;background:var(--orange-soft)"><strong>2</strong><span>需要关注</span></div></div><h2 style="text-align:center;margin:18px 0 0">看见很多，只告诉你真正重要的。</h2></section><div class="data-grid section"><div class="data-box"><strong>5 / 5</strong><span>Emma 正常到家</span></div><div class="data-box"><strong>6 次</strong><span>Buddy 正常进食</span></div><div class="data-box"><strong>3 件</strong><span>包裹均正常取走</span></div><div class="data-box"><strong>2 次</strong><span>后院活动无需处理</span></div></div><section class="note"><span class="tag">1 项建议</span><h2 style="margin-top:10px">Buddy 的进食时间变晚了</h2><p class="small muted">最近通常在 15:35 左右进食，比之前晚约 20 分钟。</p><div class="button-row"><button class="primary" onclick="toast('判断时间已更新')">更新判断时间</button><button class="secondary" onclick="toast('已保持当前设置')">保持现在</button></div></section></div>${nav('insights')}`}
    function memoryPage(){const cards=[['package','门口包裹','送达 / 仍在 / 移动 / 已取走','由你确认'],['user-circle','Emma 到家','通常到家时间 · 什么代表已到家','由你确认'],['bowl-food','Buddy 进食','通常进食时间 · 什么代表正在进食','最近校准：2 天前'],['dog','Buddy 离院','院内 / 离开 / 回来','由你确认'],['door-open','后院门','关闭 / 开启 / 离家后未关闭','由你确认'],['tree','后院','平静 / 可解释活动 / 需要关注','由你确认']];return `${header('记忆','',`<button class="icon-btn" onclick="go('add')">＋</button>`)}<div class="page"><h1>这个家，Home Pulse 已经理解这些</h1><p class="muted">所有理解都来自你主动建立或确认的关注事项。</p><div class="card summary-card section"><span><strong>${state.memoryAdded?7:6} 项</strong><br><span class="small muted">正在守护</span></span>${spirit('small')}</div><div class="memory-grid">${cards.map(x=>`<button class="memory-card" onclick="showMemory('${x[1]}','${x[2]}')"><span class="list-icon">${objectIcon(x[0],x[1])}</span><strong>${x[1]}</strong><p>我知道：${x[2]}</p><span class="tag grey">${x[3]}</span></button>`).join('')}</div><section class="note section"><span class="tag">本周 1 项建议</span><h2 style="margin:10px 0 3px">Buddy 的进食时间可能变晚</h2><button class="text-btn" onclick="go('weekly')">在周报中查看 →</button></section></div>${nav('memory')}`}
    function addPage(){const entities=[['Emma','user-circle'],['Buddy','dog'],['门口包裹','package'],['后院','tree'],['车库','garage'],['其他','plus']],videos=[['v1','9月18日','15:26'],['v2','9月19日','15:41'],['v3','9月21日','15:31'],['v4','9月23日','15:18']];return `${header('', 'memory')}<div class="page"><h1>我还想关注……</h1><section class="section"><h2>1. 选择对象</h2><div class="entity-row">${entities.map(x=>`<button class="entity-btn ${state.selectedEntity===x[0]?'selected':''}" onclick="selectEntity('${x[0]}')"><span class="list-icon">${objectIcon(x[1],x[0])}</span><strong>${x[0]}</strong></button>`).join('')}</div></section><section class="card"><h2>2. 告诉我你想知道什么</h2><textarea>我想知道 Buddy 每天下午有没有按时吃饭。</textarea><button class="soft-btn" style="width:100%;margin-top:9px" onclick="showVoice()">使用语音描述</button></section><section class="section"><h2>3. 给我几个过去的例子</h2><div class="video-grid">${videos.map(v=>`<button class="video ${state.selectedVideos.has(v[0])?'selected':''}" onclick="toggleVideo('${v[0]}')"><span class="video-thumb">${objectIcon('dog','Buddy')}<span class="sr-only">食盆录像</span></span><strong>${v[1]} ${v[2]}</strong><span>${state.selectedVideos.has(v[0])?'✓ 已选择':'点击选择'}</span></button>`).join('')}</div></section><button class="primary" style="width:100%" onclick="go('model')" ${state.selectedVideos.size<2?'disabled':''}>让 Home Pulse 理解</button></div>`}
    function modelPage(){const cards=[['尚未到时间','通常 15:20 前','静默','grey'],['等待进食','进入通常时间','静默','violet'],['已观察到进食','符合历史进食动作','普通告知',''],['超时未观察到','超过通常时间','需要关注','warn'],['无法确认','遮挡 / 设备离线','动态判断','violet']];return `${header('', 'add')}<div class="page"><p class="eyebrow">我理解你想知道</p><h1>Buddy 下午有没有正常吃饭</h1><p class="muted">根据你的描述和过去录像，我整理出了以下状态。</p><div class="state-grid section">${cards.map((x,i)=>`<div class="state-card ${i===4?'wide':''}"><strong>${x[0]}</strong><p>${x[1]}</p><span class="tag ${x[3]}">${x[2]}</span></div>`).join('')}</div><div class="card summary-card"><span><span class="small muted">通常时间</span><br><strong>15:20 – 15:50</strong></span><span class="tag grey">来自过去 8 次录像</span></div><div class="note section"><strong>AI 已完成：</strong><p class="small muted" style="margin:5px 0 0">状态划分 + 时间参数 + 初始注意力等级</p></div><div class="button-row"><button class="primary" onclick="confirmModel()">确认启用</button><button class="secondary" onclick="adjustModel()">调整</button></div></div>`}
    function attentionPage(){const cards=[['env','环境状态','只更新','首页 / Widget / Home Display',''],['info','普通告知','值得知道','普通通知 + Display',''],['need','需要关注','建议现在看一下','明显通知 + Display 持续显示 + 轻震','warn'],['urgent','紧急','立即查看','高优先通知 + Display 震动','alert']];return `${header('', 'memory')}<div class="page"><h1>什么事情，应该怎样找到你</h1><p class="muted">状态发生变化，不等于一定要发通知。</p><section class="section">${cards.map((x,i)=>`<button class="attention-card ${x[0]}" style="width:100%;text-align:left" onclick="selectAttention(${i+1})">${spirit('small '+x[4])}<span><span class="eyebrow">等级 ${i+1}</span><h2>${x[1]}</h2><strong>${x[2]}</strong><p>${x[3]}</p></span></button>`).join('')}</section><button class="secondary" style="width:100%" onclick="showAttentionPreview()">查看三个终端如何响应</button></div>${nav('memory')}`}
    function displayPage(){const modes={calm:['','目前一切平稳','安静显示'],info:['','Emma 已到家','短暂显示'],need:['warn','后院门仍开启','轻震 · 持续显示'],urgent:['alert','Buddy 已离开院子','强震 · 高优先通知']},m=modes[state.displayMode];return `${header('Home Display','',`<span class="tag">已连接 · 82%</span>`)}<div class="page"><div class="device"><div class="device-screen"><div>${spirit('small '+m[0])}<strong>${m[1]}</strong><span class="small muted">${m[2]}</span></div></div></div><h1>它会和你的家一起变化</h1><p class="muted">这个小屏不是另一个需要你查看的手机，而是放在环境里的“家的表情”。</p><div class="device-states section">${[['calm','平稳','绿色笑脸'],['info','普通变化','小气泡 · 短暂展示'],['need','需要关注','橙色 · 轻震'],['urgent','紧急','珊瑚红 · 明显震动']].map(x=>`<button class="device-state" onclick="setDisplay('${x[0]}')"><strong>${x[1]}</strong><span>${x[2]}</span></button>`).join('')}</div><section class="card"><div class="info-row"><span>震动反馈</span><strong>开启</strong></div><div class="info-row"><span>夜间模式</span><strong>22:00–07:00</strong></div><div class="info-row"><span>普通告知恢复</span><strong>30 秒</strong></div></section></div>${nav('profile')}`}
    function render(){const f={today:()=>homePage(false),'today-alert':()=>homePage(true),guard:guardPage,buddy:buddyPage,package:packagePage,activity:activityPage,insights:insightsPage,trends:trendsPage,calendar:calendarPage,weekly:weeklyPage,memory:memoryPage,add:addPage,model:modelPage,attention:attentionPage,display:displayPage};document.getElementById('app').innerHTML=(f[state.route]||f.today)();renderLinks();const p=pages.find(x=>x[0]===state.route)||pages[0];document.getElementById('current-title').textContent=p[1];document.getElementById('current-copy').textContent=p[2];window.scrollTo({top:0,behavior:'smooth'})}
    function renderLinks(){document.getElementById('page-links').innerHTML=pages.map((p,i)=>`<button class="page-link ${state.route===p[0]?'active':''}" onclick="go('${p[0]}')"><span class="index">${String(i+1).padStart(2,'0')}</span><span>${p[1]}</span></button>`).join('')}
    function go(route){state.route=route;history.replaceState(null,'','#'+route);render()}
    function setHomeMood(m){state.mood=m;state.route=m==='attention'?'today-alert':'today';history.replaceState(null,'','#'+state.route);render();toast(m==='attention'?'已切换为需要关注状态':'已切换为平稳状态')}
    function selectDate(d){state.date=d;if(d===25){state.mood='attention';state.route='today-alert'}else{state.mood='calm';state.route='today'}history.replaceState(null,'','#'+state.route);render()}
    function setTrend(x){state.trendRange=x;render()} function selectEntity(x){state.selectedEntity=x;render()} function toggleVideo(id){state.selectedVideos.has(id)?state.selectedVideos.delete(id):state.selectedVideos.add(id);render()} function setDisplay(x){state.displayMode=x;render()} function selectAttention(x){state.attentionLevel=x;showAttentionPreview(x)}
    function confirmModel(){state.memoryAdded=true;state.route='memory';history.replaceState(null,'','#memory');render();toast('“Buddy 下午进食”已加入记忆大脑')}
    let tt;function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
    function openModal(title,body,actions=''){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>${body}${actions?`<div class="button-row" style="margin-top:18px">${actions}</div>`:''}`;document.getElementById('modal-layer').classList.add('open')}
    function closeModal(){document.getElementById('modal-layer').classList.remove('open')};document.getElementById('modal-layer').onclick=e=>{if(e.target.id==='modal-layer')closeModal()}
    function showScoreInfo(){openModal('什么是“今日安心度”？',`<p>安心度来自你正在关注事项的当前状态，用于表达当前有多少事项已经被确认稳定。</p><div class="note"><strong>它不是现实安全风险的概率预测。</strong><p class="small muted" style="margin:5px 0 0">92% 不代表房屋有 92% 的概率安全。</p></div>`) }
    function showFamily(){openModal('选择家庭',`<div class="info-row"><strong>Lake House</strong><span class="tag">当前</span></div><div class="info-row"><span>City Apartment</span><span class="muted">未选择</span></div>`) }
    function showSettings(){openModal('首页设置',`<div class="info-row"><span>安心度解释</span><span>›</span></div><div class="info-row"><span>家庭成员</span><span>›</span></div><div class="info-row"><span>隐私与数据</span><span>›</span></div>`) }
    function showQuick(title,status){openModal(title,`<div class="big-state">${status}</div><p class="muted">当前状态已由 Home Pulse 确认。</p>`,`<button class="primary" onclick="closeModal();go('guard')">查看守护页</button>`) }
    function showVideo(){openModal('15:36 · Buddy 进食',`<div class="camera">4 分钟录像片段</div><p class="explanation">关键片段已定位到 Buddy 持续低头进食的位置。</p>`) }
    function showFilter(){openModal('筛选守护事项',`<div class="info-row"><span>全部</span><span class="tag">6</span></div><div class="info-row"><span>人物与宠物</span><span>3</span></div><div class="info-row"><span>物品</span><span>1</span></div><div class="info-row"><span>空间与设备</span><span>2</span></div>`) }
    function showActivityInfo(){openModal('事件如何被压缩？',`<div class="funnel"><div class="funnel-row" style="--w:100%"><strong>126</strong><span>底层检测</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:70%"><strong>7</strong><span>状态变化</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:48%"><strong>2</strong><span>通知</span></div></div>`) }
    function showEvidence(title,copy){openModal(title,`<div class="camera">Camera 关键证据</div><p class="explanation">${copy}</p>`) }
    function showDay(d){const attention=[12,24,25,26].includes(d);openModal(`9月${d}日`,`${spirit('small '+(attention?'warn':''))}<h2 style="margin-top:18px">${attention?'出现需要关注状态':'当天整体平稳'}</h2><p class="muted">${attention?'后院门在离家后持续开启。':'所有关注事项均已确认或处于稳定状态。'}</p>`) }
    function showMemory(title,known){openModal(title,`<p class="eyebrow">Home Pulse 已理解</p><h2>${known}</h2><p class="muted">这些理解来自你选择的录像、描述与后续确认。</p><div class="note"><strong>你可以随时修改、暂停或删除这项理解。</strong></div>`,`<button class="primary" onclick="closeModal();go('attention')">调整提醒</button><button class="secondary" onclick="closeModal()">完成</button>`) }
    function showVoice(){openModal('语音描述',`<div class="hero">${spirit('small')}<h2 style="margin-top:20px">正在听……</h2><p>“我想知道 Buddy 每天下午有没有按时吃饭。”</p></div>`,`<button class="primary" onclick="closeModal();toast('语音已转为文字')">使用这句话</button>`) }
    function adjustModel(){openModal('调整模型',`<label>通常进食时间</label><div class="button-row" style="margin-top:7px"><input type="text" value="15:20"><input type="text" value="15:50"></div><label style="display:block;margin-top:14px">超时多久需要关注</label><select style="margin-top:7px"><option>30 分钟</option><option>45 分钟</option></select>`,`<button class="primary" onclick="closeModal();toast('模型参数已保存')">保存</button>`) }
    function showAttentionPreview(level=state.attentionLevel){const names=['环境状态','普通告知','需要关注','紧急'],colors=['var(--mint-soft)','var(--violet-soft)','var(--orange-soft)','var(--coral-soft)'];openModal(`等级 ${level} · ${names[level-1]}`,`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="device-state" style="background:${colors[level-1]}"><strong>手机</strong><span>${level===1?'不通知':level===2?'普通通知':level===3?'明显通知':'高优先通知'}</span></div><div class="device-state" style="background:${colors[level-1]}"><strong>Widget</strong><span>更新状态</span></div><div class="device-state" style="background:${colors[level-1]}"><strong>Display</strong><span>${level<3?'短暂显示':'持续显示 + 震动'}</span></div></div><p class="small muted" style="margin-top:14px">注意力越高，系统占用用户的感官越多。</p>`,`<button class="primary" onclick="closeModal();go('display')">查看 Home Display</button>`) }
    const initial=location.hash.slice(1);if(pages.some(x=>x[0]===initial))state.route=initial;render();
  </script>
</body>
</html>
