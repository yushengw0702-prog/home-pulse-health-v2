    function weeklyPage(){return `${header('', 'insights')}<div class="page"><p class="eyebrow">9月21日 – 9月27日</p><section class="hero" style="padding-top:0"><div class="spirit-wrap" style="height:120px">${spirit('small')}</div><h1>这一周，家整体很平稳</h1><div class="score">91%</div><div class="score-label">平均安心度</div></section><section class="card"><div class="funnel"><div class="funnel-row" style="--w:100%"><strong>468</strong><span>底层视觉事件</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:83%"><strong>31</strong><span>有效状态变化</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:67%"><strong>7</strong><span>值得知道</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:51%;background:var(--orange-soft)"><strong>2</strong><span>需要关注</span></div></div><h2 style="text-align:center;margin:18px 0 0">看见很多，只告诉你真正重要的。</h2></section><div class="data-grid section"><div class="data-box"><strong>5 / 5</strong><span>约定窗口内有入户动作</span></div><div class="data-box"><strong>6 次</strong><span>Buddy 正常进食</span></div><div class="data-box"><strong>3 件</strong><span>包裹均正常取走</span></div><div class="data-box"><strong>2 次</strong><span>后院活动无需处理</span></div></div><section class="note"><span class="tag">1 项建议</span><h2 style="margin-top:10px">Buddy 的进食时间变晚了</h2><p class="small muted">最近通常在 15:35 左右进食，比之前晚约 20 分钟。</p><div class="button-row"><button class="primary" onclick="toast('判断时间已更新')">更新判断时间</button><button class="secondary" onclick="toast('已保持当前设置')">保持现在</button></div></section></div>${nav('insights')}`}
    function memoryPage(){const cards=[['package','门口包裹','送达 / 仍在 / 移动 / 已取走','由你确认'],['user-circle','约定回家','约定时间 · 是否观察到入户动作','由你确认'],['bowl-food','Buddy 进食','通常进食时间 · 什么代表正在进食','最近校准：2 天前'],['dog','Buddy 离院','院内 / 离开 / 回来','由你确认'],['door-open','后院门','关闭 / 开启 / 离家后未关闭','由你确认'],['tree','后院','平静 / 可解释活动 / 需要关注','由你确认']];if(state.customCreated)cards.unshift(['key','上班出门 · 钥匙','未观察到 / 在柜上 / 已被取走 / 无法确认','由你确认']);return `${header('记忆','',`<button class="icon-btn" onclick="go('add')">＋</button>`)}<div class="page"><h1>这个家，Home Pulse 已经理解这些</h1><p class="muted">所有理解都来自你主动建立或确认的关注事项。</p><div class="card summary-card section"><span><strong>${cards.length} 项</strong><br><span class="small muted">正在守护</span></span>${spirit('small')}</div><div class="memory-grid">${cards.map(x=>`<button class="memory-card" onclick="showMemory('${x[1]}','${x[2]}')"><span class="list-icon">${objectIcon(x[0],x[1])}</span><strong>${x[1]}</strong><p>我知道：${x[2]}</p><span class="tag grey">${x[3]}</span></button>`).join('')}</div><section class="note section"><span class="tag">本周 1 项建议</span><h2 style="margin:10px 0 3px">Buddy 的进食时间可能变晚</h2><button class="text-btn" onclick="go('weekly')">在周报中查看 →</button></section></div>${nav('memory')}`}

    function unifiedCameraPage(){const cams=[['front','前门 Camera','门口与投递区域','door-open'],['entry','玄关 Camera','玄关柜与离家区域','key'],['living','客厅 Camera','客厅主要活动区域','couch']];return `${header('', 'today')}<div class="page unified-enter">${flow(1,6)}<h1>哪台 Camera<br>能看到你关心的事情？</h1><p class="muted">先选择观察位置，下一步再告诉 Home Pulse 你想知道什么。</p><section class="section">${cams.map(c=>`<button class="camera-choice ${state.selectedCamera===c[0]?'selected':''}" onclick="selectUnifiedCamera('${c[0]}')"><span class="camera-preview">${objectIcon(c[3],c[1])}</span><span><strong>${c[1]}</strong><small>${c[2]} · 在线</small></span><span class="radio"></span></button>`).join('')}</section><div class="button-row section"><button class="primary" onclick="go('add-intent')" ${state.selectedCamera?'':'disabled'}>继续</button><button class="secondary" onclick="go('today')">取消</button></div></div>`}

    function unifiedBuildingPage(){const s=activeScenario(),labels=['理解你的需求','检查 Camera 是否能够观察','搜索相关历史记录','寻找可用的视觉证据','建立状态模型','生成提醒方式'],done=state.createBuildDone,progress=done?100:Math.round((state.createBuildStep+1)/labels.length*100);return `${header('', 'add-intent')}<div class="page unified-enter">${flow(3,6)}<h1>正在建立你的关注事项</h1><div class="intent-quote section">“${state.customIntent}”</div><div class="analysis-progress"><i style="--progress:${progress}%"></i></div><section class="ai-work-list">${labels.map((label,i)=>`<div class="ai-work-step ${done||i<state.createBuildStep?'done':i===state.createBuildStep?'active':''}"><i>${done||i<state.createBuildStep?'✓':i+1}</i><span><strong>${label}</strong><small>${s.build[i]}</small></span><b>${done||i<state.createBuildStep?'完成':i===state.createBuildStep?'处理中':''}</b></div>`).join('')}</section>${done?`<div class="analysis-result"><strong>关注事项已建立</strong><br>${s.branch}已收敛为证据、状态模型和提醒策略。</div>`:''}<div class="button-row section"><button class="primary" onclick="${done?`go('add-pick')`:`runUnifiedBuild()`}">${done?'查看 AI 找到的依据':'开始分析'}</button><button class="secondary" onclick="showEvidenceGap()">证据不足分支</button></div></div>`}
    function unifiedEvidencePage(){const s=activeScenario();return `${header('', 'add-events')}<div class="page unified-enter">${flow(4,6)}<h1>这是我找到的依据</h1><p class="muted">请确认这些历史画面符合你的意思。</p><section class="evidence-stack section">${s.evidence.map((e,i)=>`<article class="evidence-card" style="animation-delay:${i*.08}s"><video controls muted playsinline preload="metadata" poster="${e[4]}" src="${e[3]}"></video><div class="evidence-copy"><strong>${e[0]}</strong><p>${e[2]}</p><div class="evidence-meta"><span>${e[1]}</span><span>历史视频</span></div></div></article>`).join('')}</section>${s.baseline?`<div class="baseline-note section"><span class="baseline-note-icon">${objectIcon('magnifying-glass-minus','未找到异常样本')}</span><span><strong>没有找到历史异常样本</strong><p>先学习正常投递；未知活动发生时再提高关注。</p></span></div>`:''}<div class="button-row"><button class="primary" onclick="go('add-object')">符合我的意思</button><button class="secondary" onclick="showEvidenceGap()">需要调整</button></div></div>`}
    function unifiedModelPage(){const s=activeScenario(),labels=['静默','轻提醒','重点','紧急'];return `${header('', 'add-pick')}<div class="page unified-enter">${flow(5,6)}<h1>我准备这样判断</h1><p class="muted">AI 已分配提醒等级。拖动四阶轨道可以立即调整。</p><section class="policy-stack section">${s.states.map((x,i)=>{const level=scenarioPriority(i),meta=priorityMeta[level],locked=lockedScenarioPriority(i);return `<article class="policy-card priority-${level} ${locked?'locked':''}" style="--level:${level}"><div class="policy-card-head"><span class="state-priority-icon">${objectIcon(meta.icon,meta.name)}</span><strong>${x[0]}</strong><span class="priority-tag">${level} · ${meta.name}</span></div><p>${x[1]}</p><div class="priority-range"><i class="priority-track"></i><i class="priority-fill"></i><span class="priority-dots">${[1,2,3,4].map(n=>`<i class="${n<=level?'on':''}"></i>`).join('')}</span><input type="range" min="1" max="4" step="1" value="${level}" aria-label="调整${x[0]}的提醒等级" oninput="setScenarioPriority(${i},this.value)" ${locked?'disabled':''}></div><div class="priority-labels">${labels.map(label=>`<span>${label}</span>`).join('')}</div>${locked?`<div class="policy-lock">${objectIcon('lock-key','策略锁定')}涉及明确风险，紧急等级不能降低</div>`:''}</article>`}).join('')}</section><div class="button-row"><button class="primary" onclick="go('model')">下一步 · 确认</button><button class="secondary" onclick="go('add-pick')">返回依据</button></div></div>`}
    function unifiedConfirmPage(){const s=activeScenario();return `${header('', 'add-object')}<div class="page unified-enter">${flow(6,6)}<h1>确认关注事项</h1><section class="card section"><div class="info-row"><span>关注事项</span><strong>${s.name}</strong></div><div class="info-row"><span>观察位置</span><strong>${s.camera}</strong></div><div class="info-row"><span>我理解你的需求</span><strong style="max-width:220px;text-align:right">${s.summary}</strong></div><div class="info-row"><span>依据</span><strong>${s.evidence.length} 段真实历史视频</strong></div></section><h2>我会关注这些状态</h2><div class="state-chips">${s.states.map((x,i)=>`<i class="state-chip">${x[0]} · ${priorityMeta[scenarioPriority(i)].name}</i>`).join('')}</div><div class="privacy-note section"><b>◌</b><span>所有状态与提醒逻辑都在启用前展示；你可以随时调整或停用。</span></div><button class="primary" style="width:100%" onclick="finishUnifiedCreate()">确认启用</button><div class="button-row section"><button class="secondary" onclick="go('add-object')">调整</button><button class="text-btn" onclick="go('add')">取消</button></div></div>`}
    function unifiedDonePage(){const s=activeScenario();return `${header('Home Pulse')}<div class="page unified-enter"><div class="complete-mark">✓</div><div style="text-align:center"><h1>关注事项已启用</h1><p class="muted">对应卡片已经加入首页和守护页。</p></div><section class="card section"><div class="info-row"><span>${s.name}</span><strong>${s.normal}</strong></div><div class="info-row"><span>证据来源</span><strong>${s.camera}</strong></div></section><button class="primary" style="width:100%" onclick="go('today')">返回首页查看卡片</button><button class="text-btn" style="display:block;margin:14px auto" onclick="beginNewFocus()">继续创建其他事项</button></div>`}
    function unifiedGuardPage(){const base=[['package','门口包裹','仍在门口','10:48 · 状态稳定'],['bowl-food','Buddy 下午进食','等待观察','通常 15:20–15:50'],['door-open','后院门','已关闭','17:02 更新']],created=[...state.createCreated].filter(id=>createScenarios[id]).map(id=>createScenarios[id]);return `${header('守护','',`<button class="icon-btn" onclick="beginNewFocus()">＋</button>`)}<div class="page"><p class="muted">Home Pulse 正在持续更新这些状态</p><section class="section">${base.map(x=>`<button class="card list-card" style="width:100%;text-align:left" onclick="toast('${x[1]} · 状态已更新')"><span class="list-icon">${objectIcon(x[0],x[1])}</span><span><span class="card-title">${x[1]}</span><br><strong>${x[2]}</strong><br><span class="small state-good">${x[3]}</span></span><span class="chev">›</span></button>`).join('')}</section>${created.length?`<section class="guard-created"><div class="guard-created-head"><h2>你新建的关注</h2><span>${created.length} 项</span></div>${created.map(s=>`<button class="card list-card created-focus" style="width:100%;text-align:left" onclick="showQuick('${s.name}','${s.normal}')"><span class="list-icon">${objectIcon(s.icon,s.short)}</span><span><span class="card-title">${s.name}</span><br><strong>${s.normal}</strong><br><span class="small state-good">${s.status} · ${s.camera}</span></span><span class="chev">›</span></button>`).join('')}</section>`:`<button class="add-choice" onclick="beginNewFocus()"><span class="list-icon">${objectIcon('plus','添加')}</span><span><strong>添加新的关注事项</strong><small>创建后会在这里出现对应卡片</small></span><span class="chev">›</span></button>`}</div>${nav('guard')}`}
    function attentionPage(){const cards=[['env','环境状态','只更新','首页 / Widget / Home Display',''],['info','普通告知','值得知道','普通通知 + Display',''],['need','需要关注','建议现在看一下','明显通知 + Display 持续显示 + 轻震','warn'],['urgent','紧急','立即查看','高优先通知 + Display 震动','alert']];return `${header('', 'memory')}<div class="page"><h1>什么事情，应该怎样找到你</h1><p class="muted">状态发生变化，不等于一定要发通知。</p><section class="section">${cards.map((x,i)=>`<button class="attention-card ${x[0]}" style="width:100%;text-align:left" onclick="selectAttention(${i+1})">${spirit('small '+x[4])}<span><span class="eyebrow">等级 ${i+1}</span><h2>${x[1]}</h2><strong>${x[2]}</strong><p>${x[3]}</p></span></button>`).join('')}</section><button class="secondary" style="width:100%" onclick="showAttentionPreview()">查看三个终端如何响应</button></div>${nav('memory')}`}
    function displayPage(){const modes={calm:['','目前一切平稳','安静显示'],info:['','观察到入户动作','短暂显示'],need:['warn','后院门仍开启','轻震 · 持续显示'],urgent:['alert','Buddy 已离开院子','强震 · 高优先通知']},m=modes[state.displayMode];return `${header('Home Display','',`<span class="tag">已连接 · 82%</span>`)}<div class="page"><div class="device"><div class="device-screen"><div>${spirit('small '+m[0])}<strong>${m[1]}</strong><span class="small muted">${m[2]}</span></div></div></div><h1>它会和你的家一起变化</h1><p class="muted">这个小屏不是另一个需要你查看的手机，而是放在环境里的“家的表情”。</p><div class="device-states section">${[['calm','平稳','绿色笑脸'],['info','普通变化','小气泡 · 短暂展示'],['need','需要关注','橙色 · 轻震'],['urgent','紧急','珊瑚红 · 明显震动']].map(x=>`<button class="device-state" onclick="setDisplay('${x[0]}')"><strong>${x[1]}</strong><span>${x[2]}</span></button>`).join('')}</div><section class="card"><div class="info-row"><span>震动反馈</span><strong>开启</strong></div><div class="info-row"><span>夜间模式</span><strong>22:00–07:00</strong></div><div class="info-row"><span>普通告知恢复</span><strong>30 秒</strong></div></section></div>${nav('profile')}`}
    function render(){const f={onboarding:onboardingPage,zones:zonesPage,presets:presetsPage,'preset-detail':presetDetailPage,'setup-summary':setupSummaryPage,today:()=>homePage(false),'today-alert':()=>homePage(true),guard:unifiedGuardPage,buddy:buddyPage,package:packagePage,'focus-detail':createdFocusDetailPage,activity:activityPage,insights:insightsPage,trends:trendsPage,calendar:calendarPage,weekly:weeklyPage,memory:memoryPage,add:unifiedHubPage,'create-key':()=>scenarioEntryPage('key'),'create-door':()=>scenarioEntryPage('door'),'create-cats':()=>scenarioEntryPage('cats'),'add-camera':unifiedCameraPage,'add-intent':unifiedIntentPage,'add-events':unifiedBuildingPage,'add-pick':unifiedEvidencePage,'add-object':unifiedModelPage,model:unifiedConfirmPage,policy:policyPage,observing:unifiedDonePage,attention:attentionPage,display:displayPage};document.getElementById('app').innerHTML=(f[state.route]||f.today)();enhanceEvidenceVideos();renderLinks();const p=pages.find(x=>x[0]===state.route)||pages[5];document.getElementById('current-title').textContent=p[1];document.getElementById('current-copy').textContent=p[2];window.scrollTo({top:0,behavior:'smooth'})}
    function enhanceEvidenceVideos(){document.querySelectorAll('video[src*="key-on-cabinet.mp4"]').forEach(v=>v.poster='assets/demo/key-on-cabinet-poster.jpg');document.querySelectorAll('video[src*="key-taken-away.mp4"]').forEach(v=>v.poster='assets/demo/key-taken-away-poster.jpg')}
    function renderLinks(){document.getElementById('page-links').innerHTML=pages.map((p,i)=>`<button class="page-link ${state.route===p[0]?'active':''}" onclick="go('${p[0]}')"><span class="index">${String(i+1).padStart(2,'0')}</span><span>${p[1]}</span></button>`).join('')}
    function go(route){if(route==='add'){beginNewFocus();return}state.route=route;history.replaceState(null,'','#'+route);render()}
    function setHomeMood(m){state.mood=m;state.route=m==='attention'?'today-alert':'today';history.replaceState(null,'','#'+state.route);render();toast(m==='attention'?'已切换为需要关注状态':'已切换为平稳状态')}
    function selectDate(d){state.date=d;if(d===25){state.mood='attention';state.route='today-alert'}else{state.mood='calm';state.route='today'}history.replaceState(null,'','#'+state.route);render()}
    function setTrend(x){state.trendRange=x;render()} function selectEntity(x){state.selectedEntity=x;render()} function toggleVideo(id){state.selectedVideos.has(id)?state.selectedVideos.delete(id):state.selectedVideos.add(id);render()} function setDisplay(x){state.displayMode=x;render()} function selectAttention(x){state.attentionLevel=x;showAttentionPreview(x)}
    function toggleZone(id){state.zones.has(id)?state.zones.delete(id):state.zones.add(id);render()} function setPresetGroup(x){state.presetGroup=x;render()} function togglePreset(id){state.selectedPresets.has(id)?state.selectedPresets.delete(id):state.selectedPresets.add(id);state.presetDetail=id;render()} function openPresetDetail(){state.presetDetail=[...state.selectedPresets][0]||'package';go('preset-detail')} function finishSetup(){state.memoryAdded=true;go('today');toast('初始家庭理解已建立')}
    function setCustomZone(x){state.customZone=x;render()} function setCustomObject(x){state.customObject=x;render()} function updateIntent(x){state.customIntent=x} function selectCamera(x){state.selectedCamera=x;render()} function selectEvent(x){state.selectedEvent=x;render()} function pickKeySample(e){e.preventDefault();const v=document.getElementById('sample-video');if(v)v.pause();state.samplePicked=true;render();toast('已锁定钥匙对象')} function toggleSampleVideo(){const v=document.getElementById('sample-video');if(!v)return;v.paused?v.play():v.pause()} function setKeyPriority(key,value){state.keyPriorities[key]=Number(value);render()} function finishCustomFocus(){state.customCreated=true;state.memoryAdded=true;go('guard');toast('“上班出门 · 钥匙是否带走”已启用')}
    let unifiedTimer;
    function openCreatedFocus(id){if(!createScenarios[id])return;state.focusDetail=id;go('focus-detail')}
    function editCreatedFocus(id){const s=createScenarios[id];if(!s)return;state.createScenario=id;state.selectedCamera=s.cameraId;go('add-object')}
    function beginNewFocus(){clearTimeout(unifiedTimer);state.createScenario='';state.selectedCamera='';state.customIntent='';state.createBuildStep=0;state.createBuildDone=false;go('add-camera')}
    function startScenario(id){const s=createScenarios[id]||createScenarios.key;clearTimeout(unifiedTimer);state.createScenario=id;state.selectedCamera=s.cameraId;state.customIntent='';state.createBuildStep=0;state.createBuildDone=false;go('add-camera')}

    function advanceUnifiedBuild(){unifiedTimer=setTimeout(()=>{if(state.route!=='add-events')return;state.createBuildStep+=1;if(state.createBuildStep>=6){state.createBuildDone=true;state.createBuildStep=6;render();return}render();advanceUnifiedBuild()},900)}
    function showEvidenceGap(){const s=activeScenario(),extra=state.createScenario==='door'?`<div class="baseline-note" style="margin-top:10px"><span class="baseline-note-icon">${objectIcon('info','基线说明')}</span><span><strong>仍可开始观察</strong><p>正常活动基线已经足够。</p></span></div>`:'';openModal('还差一点信息',`<p>目前没有足够的视觉依据建立可靠判断。</p><div class="failure-actions"><button onclick="closeModal();go('add-camera')">在画面中帮我指出</button><button onclick="closeModal();go('add-pick')">从历史录像中选择</button><button onclick="closeModal();toast('将按描述开始观察')">先按描述观察</button><button onclick="closeModal();go('add-camera')">更换 Camera</button></div>${extra}`)}

    const analysisSteps=[['理解用户意图','确认目标是“上班前钥匙是否带走”'],['限定观察范围','工作日 07:30–09:00 · 玄关摄像头'],['搜索历史事件','扫描近 14 天 126 个视觉事件'],['定位画面主体','识别钥匙串与深色玄关柜锚点'],['对齐不同状态','聚类“在柜上、取走、遮挡”画面'],['验证视频证据','找到 2 段高相关状态片段'],['设计状态参数','生成 4 个状态与时间条件'],['映射提醒优先级','没拿时关注，已拿时静默']];
    let analysisTimer,tt;
    function analysisModalHtml(){const done=state.analysisStep>=analysisSteps.length,progress=Math.round(Math.min(state.analysisStep+1,analysisSteps.length)/analysisSteps.length*100);return `<div class="modal-head"><h2 id="modal-title">生成状态模型</h2><button class="icon-btn" onclick="closeModal()">×</button></div><div class="analysis-flow"><div class="analysis-hero"><div class="analysis-pulse">${objectIcon(done?'check':'sparkle','分析')}</div><strong>${done?'状态模型已生成':analysisSteps[state.analysisStep][0]}</strong><p class="small muted" style="margin:4px 0 0">${done?'2 段证据 · 4 个状态 · 4 级提醒':analysisSteps[state.analysisStep][1]}</p></div><div class="analysis-progress"><i style="--progress:${done?100:progress}%"></i></div><div class="analysis-steps">${analysisSteps.map((x,i)=>`<div class="analysis-step ${i<state.analysisStep?'done':i===state.analysisStep&&!done?'active':''}"><i>${i<state.analysisStep||done?'✓':i+1}</i><span><strong>${x[0]}</strong><small>${x[1]}</small></span><b>${i<state.analysisStep||done?'完成':i===state.analysisStep?'处理中':''}</b></div>`).join('')}</div>${done?`<div class="analysis-result"><strong>✓ 已根据真实视频建立反向状态模型</strong><br>钥匙在柜上时提醒，取走后保持安静。</div><button class="primary" style="width:100%;margin-top:13px" onclick="closeModal();go('model')">查看生成结果</button>`:''}</div>`}
    function startKeyAnalysis(){clearTimeout(analysisTimer);state.analysisStep=0;document.getElementById('modal').classList.add('analysis-mode');document.getElementById('modal-layer').classList.add('open');renderKeyAnalysis()}
    function renderKeyAnalysis(){document.getElementById('modal').innerHTML=analysisModalHtml();if(state.analysisStep<analysisSteps.length){analysisTimer=setTimeout(()=>{state.analysisStep+=1;renderKeyAnalysis()},1050)}}
    function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
    function openModal(title,body,actions=''){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" onclick="closeModal()">×</button></div>${body}${actions?`<div class="button-row" style="margin-top:18px">${actions}</div>`:''}`;document.getElementById('modal-layer').classList.add('open')}
    function closeModal(){clearTimeout(analysisTimer);document.getElementById('modal').classList.remove('analysis-mode');document.getElementById('modal-layer').classList.remove('open')};document.getElementById('modal-layer').onclick=e=>{if(e.target.id==='modal-layer')closeModal()}
    function showScoreInfo(){openModal('什么是“今日安心度”？',`<p>安心度来自你正在关注事项的当前状态，用于表达当前有多少事项已经被确认稳定。</p><div class="note"><strong>它不是现实安全风险的概率预测。</strong><p class="small muted" style="margin:5px 0 0">92% 不代表房屋有 92% 的概率安全。</p></div>`) }
    function showFamily(){openModal('选择家庭',`<div class="info-row"><strong>Lake House</strong><span class="tag">当前</span></div><div class="info-row"><span>City Apartment</span><span class="muted">未选择</span></div>`) }
    function showSettings(){openModal('首页设置',`<div class="info-row"><span>安心度解释</span><span>›</span></div><div class="info-row"><span>家庭成员</span><span>›</span></div><div class="info-row"><span>隐私与数据</span><span>›</span></div>`) }
    function showQuick(title,status){openModal(title,`<div class="big-state">${status}</div><p class="muted">当前状态已由 Home Pulse 确认。</p>`,`<button class="primary" onclick="closeModal();go('guard')">查看守护页</button>`) }
    function showVideo(){openModal('15:36 · Buddy 进食',`<div class="camera">4 分钟录像片段</div><p class="explanation">关键片段已定位到 Buddy 持续低头进食的位置。</p>`) }
    function showFilter(){openModal('筛选守护事项',`<div class="info-row"><span>全部</span><span class="tag">6</span></div><div class="info-row"><span>人物与宠物</span><span>3</span></div><div class="info-row"><span>物品</span><span>1</span></div><div class="info-row"><span>空间与设备</span><span>2</span></div>`) }
    function showActivityInfo(){openModal('事件如何被压缩？',`<div class="funnel"><div class="funnel-row" style="--w:100%"><strong>126</strong><span>底层检测</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:70%"><strong>7</strong><span>状态变化</span></div><div class="funnel-arrow">↓</div><div class="funnel-row" style="--w:48%"><strong>2</strong><span>通知</span></div></div>`) }
    function showEvidence(title,copy){openModal(title,`<div class="camera">Camera 关键证据</div><p class="explanation">${copy}</p>`) }
    function showDay(d){const attention=[12,24,25,26].includes(d);openModal(`9月${d}日`,`${spirit('small '+(attention?'warn':''))}<h2 style="margin-top:18px">${attention?'出现需要关注状态':'当天整体平稳'}</h2><p class="muted">${attention?'后院门在离家后持续开启。':'所有关注事项均已确认或处于稳定状态。'}</p>`) }
    function showMemory(title,known){openModal(title,`<p class="eyebrow">Home Pulse 已理解</p><h2>${known}</h2><p class="muted">这些理解来自你选择的录像、描述与后续确认。</p><div class="note"><strong>你可以随时修改、暂停或删除这项理解。</strong></div>`,`<button class="primary" onclick="closeModal();go('attention')">调整提醒</button><button class="secondary" onclick="closeModal()">完成</button>`) }
    function showVoice(){const phrase=activeScenario().intent;openModal('语音描述',`<div class="hero">${spirit('small')}<h2 style="margin-top:20px">正在听……</h2><p>“${phrase}”</p></div>`,`<button class="primary" onclick="closeModal();state.customIntent=activeScenario().intent;render();toast('已转为文字')">使用这句话</button>`) }
    function adjustKeyWindow(){openModal('出门时间',`<label>工作日观察窗口</label><div class="button-row" style="margin-top:7px"><input id="key-start" type="text" value="${state.keyWindowStart}"><input id="key-end" type="text" value="${state.keyWindowEnd}"></div><p class="small muted" style="margin-top:10px">窗口结束时钥匙仍在柜上，才进入“需要关注”。</p>`,`<button class="primary" onclick="state.keyWindowStart=document.getElementById('key-start').value;state.keyWindowEnd=document.getElementById('key-end').value;closeModal();render();toast('时间已更新')">保存</button>`) }
    function showAttentionPreview(level=state.attentionLevel){const names=['环境状态','普通告知','需要关注','紧急'],colors=['var(--mint-soft)','var(--violet-soft)','var(--orange-soft)','var(--coral-soft)'];openModal(`等级 ${level} · ${names[level-1]}`,`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div class="device-state" style="background:${colors[level-1]}"><strong>手机</strong><span>${level===1?'不通知':level===2?'普通通知':level===3?'明显通知':'高优先通知'}</span></div><div class="device-state" style="background:${colors[level-1]}"><strong>Widget</strong><span>更新状态</span></div><div class="device-state" style="background:${colors[level-1]}"><strong>Display</strong><span>${level<3?'短暂显示':'持续显示 + 震动'}</span></div></div><p class="small muted" style="margin-top:14px">注意力越高，系统占用用户的感官越多。</p>`,`<button class="primary" onclick="closeModal();go('display')">查看 Home Display</button>`) }
    const initial=location.hash.slice(1);if(pages.some(x=>x[0]===initial))state.route=initial;render();
  </script>
</body>
</html>
